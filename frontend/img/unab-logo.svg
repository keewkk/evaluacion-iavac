<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <!-- Shield background -->
  <path d="M100 8 L185 48 L185 135 Q185 195 100 225 Q15 195 15 135 L15 48 Z" fill="#003366"/>
  <path d="M100 15 L178 52 L178 133 Q178 190 100 218 Q22 190 22 133 L22 52 Z" fill="#003366" stroke="#C5960C" stroke-width="2.5"/>
  
  <!-- Inner shield border -->
  <path d="M100 24 L170 57 L170 130 Q170 183 100 210 Q30 183 30 130 L30 57 Z" fill="none" stroke="#C5960C" stroke-width="1" opacity="0.4"/>

  <!-- Star at top -->
  <polygon points="100,30 104,40 114,40 106,46 109,56 100,50 91,56 94,46 86,40 96,40" fill="#C5960C"/>

  <!-- Open book -->
  <g transform="translate(100,95)">
    <!-- Left page -->
    <path d="M-4,-25 Q-32,-22 -38,-18 L-38,22 Q-32,18 -4,16 Z" fill="#ffffff" stroke="#C5960C" stroke-width="0.8"/>
    <!-- Right page -->
    <path d="M4,-25 Q32,-22 38,-18 L38,22 Q32,18 4,16 Z" fill="#ffffff" stroke="#C5960C" stroke-width="0.8"/>
    <!-- Spine -->
    <line x1="0" y1="-27" x2="0" y2="18" stroke="#C5960C" stroke-width="2"/>
    <!-- Lines on left page -->
    <line x1="-32" y1="-10" x2="-8" y2="-12" stroke="#003366" stroke-width="0.8" opacity="0.35"/>
    <line x1="-32" y1="-2" x2="-8" y2="-4" stroke="#003366" stroke-width="0.8" opacity="0.35"/>
    <line x1="-32" y1="6" x2="-8" y2="4" stroke="#003366" stroke-width="0.8" opacity="0.35"/>
    <!-- Lines on right page -->
    <line x1="8" y1="-12" x2="32" y2="-10" stroke="#003366" stroke-width="0.8" opacity="0.35"/>
    <line x1="8" y1="-4" x2="32" y2="-2" stroke="#003366" stroke-width="0.8" opacity="0.35"/>
    <line x1="8" y1="4" x2="32" y2="6" stroke="#003366" stroke-width="0.8" opacity="0.35"/>
  </g>

  <!-- Laurel left -->
  <g opacity="0.85">
    <path d="M50 170 Q56 155 52 140 Q54 128 58 118" fill="none" stroke="#C5960C" stroke-width="1.5"/>
    <ellipse cx="46" cy="155" rx="7" ry="3.5" fill="#C5960C" transform="rotate(-25 46 155)" opacity="0.6"/>
    <ellipse cx="49" cy="143" rx="7" ry="3.5" fill="#C5960C" transform="rotate(-15 49 143)" opacity="0.6"/>
    <ellipse cx="54" cy="131" rx="6" ry="3" fill="#C5960C" transform="rotate(-10 54 131)" opacity="0.6"/>
  </g>
  <!-- Laurel right -->
  <g opacity="0.85">
    <path d="M150 170 Q144 155 148 140 Q146 128 142 118" fill="none" stroke="#C5960C" stroke-width="1.5"/>
    <ellipse cx="154" cy="155" rx="7" ry="3.5" fill="#C5960C" transform="rotate(25 154 155)" opacity="0.6"/>
    <ellipse cx="151" cy="143" rx="7" ry="3.5" fill="#C5960C" transform="rotate(15 151 143)" opacity="0.6"/>
    <ellipse cx="146" cy="131" rx="6" ry="3" fill="#C5960C" transform="rotate(10 146 131)" opacity="0.6"/>
  </g>

  <!-- University text -->
  <text x="100" y="152" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" font-family="Georgia, 'Times New Roman', serif" letter-spacing="1.5">UNIVERSIDAD</text>
  <text x="100" y="170" text-anchor="middle" fill="#C5960C" font-size="13" font-weight="bold" font-family="Georgia, 'Times New Roman', serif" letter-spacing="1">ANDRÉS BELLO</text>

  <!-- Bottom decoration -->
  <line x1="55" y1="180" x2="145" y2="180" stroke="#C5960C" stroke-width="0.8" opacity="0.5"/>
</svg>

